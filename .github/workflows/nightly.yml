name: Nightly update

on:
  schedule:
    # Minutes « bizarres » exprès : à l'heure pile, GitHub est saturé et saute parfois les tâches.
    - cron: "17 3 * * *"       # passage principal : 4h17 à Paris (hiver)
    - cron: "43 6 * * *"       # passage de secours : 7h43 à Paris (ne change rien si déjà à jour)
  workflow_dispatch: {}         # bouton "Run workflow" pour lancer à la main
  push:
    branches: [main]
    paths: ["src/**", "tournaments/**", ".github/workflows/**"]   # republie dès qu'on modifie le site

permissions:
  contents: write               # pour sauvegarder l'historique (state/)
  pages: write
  id-token: write

concurrency:
  group: seeded-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Mise à jour complète (données, cotes, calculs, site)
        run: python src/run_all.py --download
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # secret GitHub (vide = pas de cotes, le site marche quand même)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}                       # point 15a : concours (vide = pas de concours)
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}   # publique par nature : mise dans la page
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}         # secrète : seulement pour le robot
      - name: Garder les données au chaud pour les passages live (cache privé de GitHub, jamais publié)
        uses: actions/cache/save@v4
        with:
          path: |
            data
            outputs
          key: tml-${{ github.run_id }}
      - name: Sauvegarder l'historique (évolutions d'un jour à l'autre)
        run: |
          git config user.name "seeded-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "state: mise à jour du $(date -u +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
